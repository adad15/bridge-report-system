<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 900" width="1320" height="900">
<style>
text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', SimHei, sans-serif; }
.title { font-size: 22px; font-weight: 700; fill: #111827; }
.subtitle { font-size: 13px; fill: #6b7280; }
.label { font-size: 14px; font-weight: 600; fill: #111827; }
.small { font-size: 12px; fill: #374151; }
.tiny { font-size: 11px; fill: #6b7280; }
</style>
<defs>
<marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
</marker>
<marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
</marker>
<marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
</marker>
<marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/>
</marker>
<marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
</marker>
<marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
</marker>
</defs>
<rect width="1320" height="900" fill="#ffffff"/>
<text x="40" y="42" class="title">模块 03 交接时序：从导入到确认入库</text>
<text x="40" y="66" class="subtitle">谁读写候选 JSON，以及什么时候变成正式事实</text>
<rect x="30" y="95" width="140" height="50" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="100.0" y="122" text-anchor="middle" class="label">用户</text>
<line x1="100" y1="145" x2="100" y2="830" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="6 5"/>
<rect x="210" y="95" width="140" height="50" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="280.0" y="122" text-anchor="middle" class="label">前端</text>
<line x1="280" y1="145" x2="280" y2="830" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="6 5"/>
<rect x="400" y="95" width="140" height="50" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="470.0" y="122" text-anchor="middle" class="label">C++ 主服务</text>
<line x1="470" y1="145" x2="470" y2="830" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="6 5"/>
<rect x="600" y="95" width="140" height="50" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="670.0" y="122" text-anchor="middle" class="label">文件归档</text>
<line x1="670" y1="145" x2="670" y2="830" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="6 5"/>
<rect x="800" y="95" width="140" height="50" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="870.0" y="122" text-anchor="middle" class="label">Python</text>
<text x="870.0" y="139" text-anchor="middle" class="label">工具服务</text>
<line x1="870" y1="145" x2="870" y2="830" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="6 5"/>
<rect x="1010" y="95" width="140" height="50" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="1080.0" y="122" text-anchor="middle" class="label">PostgreSQ</text>
<text x="1080.0" y="139" text-anchor="middle" class="label">L</text>
<line x1="1080" y1="145" x2="1080" y2="830" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="6 5"/>
<path d="M 100,180 L 280,180" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
<rect x="234" y="158" width="92" height="18" rx="9" fill="#ffffff" opacity="0.95"/>
<text x="280" y="172" text-anchor="middle" class="tiny">选择桥梁/年度</text>
<path d="M 280,230 L 470,230" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
<rect x="424" y="208" width="92" height="18" rx="9" fill="#ffffff" opacity="0.95"/>
<text x="470" y="222" text-anchor="middle" class="tiny">上传 Word</text>
<path d="M 470,280 L 670,280" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
<rect x="624" y="258" width="92" height="18" rx="9" fill="#ffffff" opacity="0.95"/>
<text x="670" y="272" text-anchor="middle" class="tiny">保存原始文件</text>
<path d="M 470,330 L 870,330" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
<rect x="824" y="308" width="92" height="18" rx="9" fill="#ffffff" opacity="0.95"/>
<text x="870" y="322" text-anchor="middle" class="tiny">请求解析</text>
<path d="M 870,380 L 870,380" fill="none" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow-purple)"/>
<rect x="824" y="358" width="92" height="18" rx="9" fill="#ffffff" opacity="0.95"/>
<text x="870" y="372" text-anchor="middle" class="tiny">抽取表格/图片</text>
<path d="M 870,430 L 470,430" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
<rect x="424" y="408" width="92" height="18" rx="9" fill="#ffffff" opacity="0.95"/>
<text x="470" y="422" text-anchor="middle" class="tiny">返回候选 JSON</text>
<path d="M 470,480 L 1080,480" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
<rect x="1034" y="458" width="92" height="18" rx="9" fill="#ffffff" opacity="0.95"/>
<text x="1080" y="472" text-anchor="middle" class="tiny">写 parsed_result_json</text>
<path d="M 280,540 L 470,540" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
<rect x="424" y="518" width="92" height="18" rx="9" fill="#ffffff" opacity="0.95"/>
<text x="470" y="532" text-anchor="middle" class="tiny">读取导入记录</text>
<path d="M 470,590 L 1080,590" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
<rect x="1034" y="568" width="92" height="18" rx="9" fill="#ffffff" opacity="0.95"/>
<text x="1080" y="582" text-anchor="middle" class="tiny">取候选 JSON</text>
<path d="M 280,640 L 100,640" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
<rect x="54" y="618" width="92" height="18" rx="9" fill="#ffffff" opacity="0.95"/>
<text x="100" y="632" text-anchor="middle" class="tiny">展示待校对项</text>
<path d="M 100,700 L 280,700" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
<rect x="234" y="678" width="92" height="18" rx="9" fill="#ffffff" opacity="0.95"/>
<text x="280" y="692" text-anchor="middle" class="tiny">修改并确认</text>
<path d="M 280,750 L 470,750" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
<rect x="424" y="728" width="92" height="18" rx="9" fill="#ffffff" opacity="0.95"/>
<text x="470" y="742" text-anchor="middle" class="tiny">提交确认结果</text>
<path d="M 470,800 L 1080,800" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
<rect x="1034" y="778" width="92" height="18" rx="9" fill="#ffffff" opacity="0.95"/>
<text x="1080" y="792" text-anchor="middle" class="tiny">写正式业务表</text>
<rect x="40" y="158" width="1180" height="350" rx="12" ry="12" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="7 5"/>
<text x="56" y="182" class="small" font-weight="600">解析阶段：只产生候选数据，不写正式事实</text>
<rect x="40" y="520" width="1180" height="330" rx="12" ry="12" fill="#fff7ed" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="7 5"/>
<text x="56" y="544" class="small" font-weight="600">校对阶段：人工确认后，C++ 才把候选 JSON 写入正式表</text>
<rect x="40" y="820" width="260" height="112" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
<text x="52" y="840" class="small" font-weight="600">图例</text>
<line x1="52" y1="862" x2="94" y2="862" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
<text x="104" y="866" class="tiny">用户/前端请求</text>
<line x1="52" y1="884" x2="94" y2="884" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
<text x="104" y="888" class="tiny">候选数据保存</text>
<line x1="52" y1="906" x2="94" y2="906" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
<text x="104" y="910" class="tiny">触发或确认</text>
<line x1="52" y1="928" x2="94" y2="928" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow-purple)"/>
<text x="104" y="932" class="tiny">解析处理</text>
</svg>