<style>

-link);border-color:var(--b)}#bridge-mobile-prototype .fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}#bridge-mobile-prototype label{display:block;font-size:13px;color:var(--muted)}#bridge-mobile-prototype input,#bridge-mobile-prototype select,#bridge-mobile-prototype textarea{display:block;width:100%;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);padding:10px;min-height:var(--touch);font-size:16px;margin-top:5px}#bridge-mobile-prototype textarea{resize:vertical;min-height:76px}#bridge-mobile-prototype .choice{display:flex;gap:8px;flex-wrap:wrap}#bridge-mobile-prototype .choice button{flex:1;min-width:70px;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:10px 7px;min-height:var(--touch)}#bridge-mobile-prototype .choice button[aria-pressed=true]{color:var(--link);border-color:var(--b);background:var(--tint)}#bridge-mobile-prototype .components{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}#bridge-mobile-prototype .components.list{grid-template-columns:1fr 1fr}#bridge-mobile-prototype .component{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px 4px;min-height:64px;display:grid;gap:2px;text-align:center}#bridge-mobile-prototype .component[aria-pressed=true]{background:var(--tint);border-color:var(--b);box-shadow:inset 0 0 0 1px var(--b)}#bridge-mobile-prototype .component small{font-size:11px;color:var(--muted)}#bridge-mobile-prototype .selected{border-left:3px solid var(--b);padding:10px 12px;background:var(--tint);border-radius:4px}#bridge-mobile-prototype .selected b{display:block;font-weight:500}#bridge-mobile-prototype .metric{font-size:26px;line-height:1.4;font-variant-numeric:tabular-nums}#bridge-mobile-prototype .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}#bridge-mobile-prototype .foot{padding:14px 16px;background:var(--paper);border-top:1px solid var(--line);display:grid;gap:10px}#bridge-mobile-prototype .foot .two{grid-template-columns:1fr 1.8fr}#bridge-mobile-prototype .photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}#bridge-mobile-prototype .photo{position:relative;width:calc(50% - 4px);padding:12px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);display:grid;gap:6px;justify-items:center;font-size:11px}#bridge-mobile-prototype .photo .icon{height:44px;color:var(--muted)}#bridge-mobile-prototype .photo button{width:44px;height:44px;position:absolute;top:0;right:0;border:0;background:transparent;font-size:18px}#bridge-mobile-prototype .preview{line-height:1.9;font-size:14px;overflow-wrap:anywhere}#bridge-mobile-prototype .record{display:block;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px}#bridge-mobile-prototype .success{margin:12px auto 18px;width:64px;height:64px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--greenbg);color:var(--green);font-size:30px}#bridge-mobile-prototype .center{text-align:center}#bridge-mobile-prototype .error{color:var(--red);font-size:12px;margin-top:8px}#bridge-mobile-prototype .toast{padding:10px 16px;background:var(--greenbg);color:var(--green);font-size:12px}#bridge-mobile-prototype .empty{text-align:center;padding:32px 8px;color:var(--muted)}#bridge-mobile-prototype .demo{font-size:11px;color:var(--muted);text-align:center;padding:10px 12px;background:var(--paper);border-top:1px solid var(--line)}#bridge-mobile-prototype .check{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:13px}#bridge-mobile-prototype .check input{width:20px;height:20px;min-height:20px;margin:0}
@media(max-width:360px){#bridge-mobile-prototype main{padding:14px 12px}#bridge-mobile-prototype .shell{border-radius:16px}#bridge-mobile-prototype .panel{padding:12px}#bridge-mobile-prototype .components{gap:6px}#bridge-mobile-prototype h2{font-size:20px}}
</style>
<div class="shell" id="br-shell"><div class="topline"><span>移动端交互原型 · V1</span><span id="br-connection">● 在线采集</span></div><header class="head" id="br-header"></header><div id="br-toast" class="toast" hidden role="status"></div><main id="br-main"></main><div id="br-footer"></div><div class="demo">示例数据 · 提交、拍照与草稿均为本原型内演示</div></div>
<script>
(()=>{
const root=document.getElementById('bridge-mobile-prototype'),$=s=>root.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ico=n=>`<span class="icon"><i data-lucide="${n}" aria-hidden="true"></i></span>`;
const design={entry:'grid',touch:46};
const s={page:'home',span:'1',kind:'主梁',selected:3,filter:'全部',query:'',online:true,error:'',toast:'',recordId:null,records:[],drafts:[],form:null};let seq=1;
const blank=()=>({type:'横向裂缝',position:'底面',distance:'2.0',count:'1',length:'0.80',width:'0.15',area:'',note:'',photos:[],noPhoto:false});s.form=blank();
const component=()=>({id:`demo-${s.kind==='主梁'?'beam':'bearing'}-${s.span}-${s.selected}`,name:`${s.span}-${s.selected}# ${s.kind}`,span:s.span,kind:s.kind,index:s.selected});
const types=()=>s.kind==='主梁'?['横向裂缝','纵向裂缝','剥落、掉角']:['开裂','变形','脱空'];
const crack=()=>['横向裂缝','纵向裂缝','开裂'].includes(s.form.type);
function desc(){const c=component(),f=s.form,loc=`${c.name}${f.position}${f.distance?`，距小桩号端 ${f.distance} m 处`:''}`;return crack()?`${loc}发现${f.type} ${f.count||'—'} 条，长度 ${f.length||'—'} m，最大宽度 ${f.width||'—'} mm。`:f.type==='剥落、掉角'?`${loc}发现剥落、掉角，面积 ${f.area||'—'} m²。`:`${loc}发现${f.type}。`;}
const nav=p=>`<nav aria-label="移动端主导航">${[['home','clipboard-list','任务'],['records','notebook-pen','记录'],['mine','user-round','我的']].map(([v,i,t])=>`<button class="cursor-interaction" data-go="${v}" aria-pressed="${p===v}">${ico(i)}${t}</button>`).join('')}</nav>`;
const action=(a,t,primary=false)=>`<button class="action ${primary?'primary':''} cursor-interaction" data-action="${a}">${t}</button>`;
const steps=n=>`<div class="step" aria-label="采集步骤">${['选构件','记病害','核对提交'].map((t,i)=>`<span class="${n===i+1?'active':''}">${i+1} ${t}</span>`).join('')}</div>`;
const notice=t=>`<div class="notice">${t}</div>`;
const context=()=>`<div class="selected"><span class="small muted">演示桥 / 2026 年 / 第 ${s.span} 跨</span><b>${esc(component().name)}</b></div>`;
const field=(id,title,step='any')=>`<label>${title}<input data-field="${id}" type="number" min="0" step="${step}" inputmode="decimal" value="${esc(s.form[id])}"></label>`;
function render(){
const p=s.page,titles={home:['现场采集','桥梁检测报告系统'],select:['选择构件','演示桥 · 2026 定期检测'],form:['记录病害','台账构件已关联'],review:['核对并提交','检查内容和照片'],success:['提交完成','演示桥 · 2026 定期检测'],records:['采集记录','演示桥 · 2026 定期检测'],detail:['记录详情','现场采集记录'],mine:['我的','检测员 · 示例账号']};
$('#br-header').innerHTML=`${['home','records','mine'].includes(p)?'<span class="brand">桥</span>':`<button class="back cursor-interaction" data-action="back" aria-label="返回上一页">‹</button>`}<div><h1>${titles[p][0]}</h1><div class="small muted">${titles[p][1]}</div></div>`;
$('#br-connection').textContent=s.online?'● 在线采集':'○ 网络中断';$('#br-connection').style.color=s.online?'var(--green)':'var(--amber)';$('#br-toast').hidden=!s.toast;$('#br-toast').textContent=s.toast;
let body='',foot='';
if(p==='home'){
body=`<h2>今天，去现场。</h2><div class="muted small">从系统台账开始，每条记录都有归属。</div><section class="panel gap"><div class="row"><span class="tag">2026 定期检测</span><span class="tag good">可采集</span></div><h2 style="margin-top:16px">演示桥</h2><div class="muted small">梁式桥 · 第 1—2 跨 · 原型示例任务</div><hr><div class="kv"><span>构件台账</span><span>第 1 版 · 已确认</span></div><div class="kv"><span>病害指标</span><span>跟随本年度评定树</span></div><div class="gap">${action('start','＋ 开始采集',true)}</div></section><div class="two gap"><button class="panel cursor-interaction" data-action="pending" style="text-align:left"><div class="small muted">已提交 · 待复核</div><div class="metric">${s.records.length}</div></button><button class="panel cursor-interaction" data-action="drafts" style="text-align:left"><div class="small muted">未提交草稿</div><div class="metric">${s.drafts.length}</div></button></div><div class="gap">${notice('构件名称来自已确认台账；选择适用病害指标后填写测量值，提交时一并关联。')}</div>`;foot=nav('home');}
if(p==='select'){
body=steps(1)+`<h3>先找到正在检查的构件</h3><p class="muted small">名称和编号与桌面端使用同一份台账。</p><div class="fields gap"><label>跨号<select data-select="span"><option value="1" ${s.span==='1'?'selected':''}>第 1 跨</option><option value="2" ${s.span==='2'?'selected':''}>第 2 跨</option></select></label><label>构件类型<select data-select="kind"><option ${s.kind==='主梁'?'selected':''}>主梁</option><option ${s.kind==='支座'?'selected':''}>支座</option></select></label></div><label class="gap">按编号查找<input id="br-search" type="search" value="${esc(s.query)}" placeholder="例如 1-3" autocomplete="off"></label><div id="br-grid"></div><div class="gap" id="br-selected">${context()}</div><div class="gap">${notice('未找到构件时，由台账管理员核实名称与编号；不临时自造构件名称。')}</div>`;foot=`<div class="foot">${action('to-form','记录此构件的病害 →',true)}</div>`;}
if(p==='form'){
body=steps(2)+context()+`<section class="panel gap"><div class="row"><h3>病害指标</h3><span class="small muted">适用项 · 示例</span></div><div class="choice gap">${types().map(t=>`<button class="cursor-interaction" data-defect="${t}" aria-pressed="${s.form.type===t}">${t}</button>`).join('')}</div><label class="gap">发生部位<select data-field="position">${(s.kind==='主梁'?['底面','侧面','端部']:['本体','边缘']).map(v=>`<option ${s.form.position===v?'selected':''}>${v}</option>`).join('')}</select></label><div class="gap">${field('distance','距小桩号端（m，可选）')}</div><div class="fields gap">${crack()?field('count','裂缝数量（条）','1')+field('length','长度（m）')+field('width','最大宽度（mm）'):s.form.type==='剥落、掉角'?field('area','面积（m²）'):''}</div></section><section class="panel gap"><div class="row"><h3>病害照片</h3><span class="small muted">随记录自动关联</span></div><div class="gap">${action('photo',`${ico('camera')} 拍照 / 从相册选择`)}</div><div class="photos">${s.form.photos.map((x,i)=>`<div class="photo">${ico('image')}<span>示例照片 ${i+1} · ${i===0?'全景':'细节'}</span><span class="tag good">上传完成（模拟）</span><button class="cursor-interaction" data-remove-photo="${i}" aria-label="删除照片 ${i+1}">×</button></div>`).join('')}</div>${!s.form.photos.length?`<label class="check gap"><input type="checkbox" data-field="noPhoto" ${s.form.noPhoto?'checked':''}>现场暂不便拍照，标记待补照片</label>`:''}</section><section class="panel gap"><div class="row"><h3>描述预览</h3><span class="tag">按字段生成</span></div><div class="preview gap" id="br-description" aria-live="polite">${esc(desc())}</div><label class="gap">补充说明（可选）<textarea data-field="note" placeholder="记录测量条件、现场限制等">${esc(s.form.note)}</textarea></label></section><div id="br-error" class="error" role="alert">${esc(s.error)}</div>`;foot=`<div class="foot"><div class="two">${action('save','保存草稿')}${action('to-review','下一步 · 核对',true)}</div></div>`;}
if(p==='review'){
body=steps(3)+`<h2>提交前，快速核对</h2><p class="muted small">构件、指标、描述和照片将作为一条记录提交。</p><section class="panel gap"><div class="kv"><span>桥梁 / 年度</span><span>演示桥 / 2026</span></div><div class="kv"><span>台账构件</span><span>${esc(component().name)}</span></div><div class="kv"><span>病害指标</span><span>${esc(s.form.type)}</span></div><div class="kv"><span>关联照片</span><span>${s.form.photos.length?s.form.photos.length+' 张 · 已上传':'无 · 待补照片'}</span></div><hr><div class="preview">${esc(desc())}</div>${s.form.note?`<p class="small muted">补充：${esc(s.form.note)}</p>`:''}<button class="link cursor-interaction" data-go="form">返回修改</button></section><div class="gap">${notice('提交后进入年度待复核列表，保留已选构件及指标。桌面端核对检测内容后确认入库，再进行系统评定。')}</div>${!s.online?'<p class="small warn">网络中断，内容仍保留。恢复后重试，或先保存草稿。</p>':''}<label class="check gap"><input id="br-offline" type="checkbox" ${!s.online?'checked':''}>演示：提交时网络中断</label><div class="error" role="alert">${esc(s.error)}</div>`;foot=`<div class="foot"><div class="two">${action('save','保存草稿')}${action('submit',s.online?'提交采集记录':'恢复后重试',true)}</div><div class="center small muted">此处只演示回执，不连接业务库</div></div>`;}
if(p==='success'){
const r=s.records.find(x=>x.id===s.recordId);body=`<div class="success">✓</div><div class="center"><h2>采集记录已提交</h2><p class="muted">已关联构件，等待内容复核</p><span class="tag warn">待复核 · 演示回执</span></div><section class="panel gap"><div class="kv"><span>记录编号</span><span>${esc(r?.id)}</span></div><div class="kv"><span>构件</span><span>${esc(r?.component.name)}</span></div><div class="kv"><span>病害</span><span>${esc(r?.form.type)}</span></div><div class="kv"><span>照片</span><span>${r?.form.photos.length||0} 张${r?.form.noPhoto?' · 待补照片':''}</span></div><hr><div class="small muted">名称与描述已随采集字段确定，无需再次按文字匹配构件。</div></section><div class="stack gap">${action('same','继续记录此构件',true)}${action('next','下一个构件 →')}<button class="link cursor-interaction" data-action="view-record">查看这条记录</button></div>`;foot=nav('records');}
if(p==='records'){
body=`<div class="choice">${['全部','待复核','草稿'].map(x=>`<button class="cursor-interaction" data-filter="${x}" aria-pressed="${s.filter===x}">${x}${x==='草稿'?' '+s.drafts.length:x==='待复核'?' '+s.records.length:''}</button>`).join('')}</div><div class="stack gap">${[...(s.filter==='草稿'?[]:s.records),...(s.filter==='待复核'?[]:s.drafts)].map(r=>`<button class="record cursor-interaction" data-record="${r.id}"><div class="row"><strong>${esc(r.component.name)}</strong><span class="tag ${r.draft?'':'warn'}">${r.draft?'草稿':'待复核'}</span></div><p>${esc(r.form.type)}</p><div class="muted small">${esc(r.id)} · ${r.form.photos.length} 张照片</div></button>`).join('')||'<div class="empty"><p>还没有采集记录</p><div class="small">从台账中选择构件，开始第一条记录。</div></div>'}</div><div class="gap">${action('start','＋ 新增采集记录',true)}</div>`;foot=nav('records');}
if(p==='detail'){
const r=[...s.records,...s.drafts].find(x=>x.id===s.recordId);body=r?`<div class="row"><h2>${esc(r.component.name)}</h2><span class="tag ${r.draft?'':'warn'}">${r.draft?'草稿':'待复核'}</span></div><p class="muted small">${esc(r.id)} · 2026 年度现场采集</p><section class="panel gap"><div class="kv"><span>病害指标</span><span>${esc(r.form.type)}</span></div><hr><div class="preview">${esc(r.description)}</div>${r.form.note?`<p class="muted small">补充：${esc(r.form.note)}</p>`:''}<div class="kv"><span>关联照片</span><span>${r.form.photos.length} 张${r.form.noPhoto?' · 待补照片':''}</span></div></section><div class="gap">${notice(r.draft?'草稿尚未提交，可继续编辑。此处草稿仅用于原型演示。':'记录进入桌面端待复核列表；构件和病害指标的关联随记录保留。')}</div>`:'';foot=`<div class="foot">${r?.draft?action('resume','继续编辑草稿',true):action('to-records','返回采集记录',true)}</div>`;}
if(p==='mine'){
body=`<section class="panel"><h2>检测员</h2><div class="muted small">示例账号 · 现场采集</div><hr><div class="kv"><span>当前任务</span><span>演示桥 · 2026</span></div><div class="kv"><span>网络状态</span><span>${s.online?'在线':'中断'}</span></div><div class="kv"><span>已提交记录</span><span>${s.records.length} 条</span></div><div class="kv"><span>未提交草稿</span><span>${s.drafts.length} 条</span></div></section><section class="panel gap"><h3>本次原型范围</h3><p class="muted small">展示在线采集、受控构件选择、结构化描述、照片关联和提交回执。拍照、登录、上传及正式审核尚未接入。</p><p class="muted small">演示记录保留在当前页面，刷新即重置。</p></section>`;foot=nav('mine');}
$('#br-main').innerHTML=body;$('#br-footer').innerHTML=foot;if(p==='select')grid();if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:18,height:18}});
}
function grid(){const vals=Array.from({length:8},(_,i)=>i+1).filter(i=>`${s.span}-${i}# ${s.kind}`.includes(s.query.trim()));$('#br-grid').innerHTML=`<div class="row gap"><span class="small muted">第 ${s.span} 跨 · ${s.kind} · ${vals.length} 件</span><span class="small muted">台账编号</span></div><div class="components ${design.entry==='list'?'list':''}">${vals.map(i=>`<button class="component cursor-interaction" data-component="${i}" aria-pressed="${s.selected===i}"><span>${s.span}-${i}#</span><small>${s.kind}</small></button>`).join('')}</div>${vals.length?'':'<p class="muted small">未找到匹配构件，请调整编号或跨号。</p>'}`;}
function go(p){s.page=p;s.error='';s.toast='';render();}
function validate(){const f=s.form,positive=k=>Number.isFinite(Number(f[k]))&&Number(f[k])>0;if(f.distance!==''&&(!Number.isFinite(Number(f.distance))||Number(f.distance)<0))return '距小桩号端必须是非负数。';if(crack()&&(!positive('count')||!Number.isInteger(Number(f.count))||!positive('length')||!positive('width')))return '请填写有效裂缝数量、长度和最大宽度，数量须为正整数。';if(f.type==='剥落、掉角'&&!positive('area'))return '请填写大于 0 的剥落面积。';if(!f.photos.length&&!f.noPhoto)return '请添加病害照片，或勾选“暂不便拍照”。';return '';}
function fresh(){s.form=blank();s.form.type=types()[0];s.form.position=s.kind==='主梁'?'底面':'本体';s.recordId=null;}
function save(){const old=s.drafts.find(x=>x.id===s.recordId),r={id:old?.id||`DRAFT-${String(seq++).padStart(3,'0')}`,component:component(),form:structuredClone(s.form),description:desc(),draft:true};s.drafts=s.drafts.filter(x=>x.id!==r.id);s.drafts.unshift(r);s.recordId=r.id;s.filter='草稿';go('records');s.toast='草稿已保留，可从记录列表继续编辑（原型演示）。';render();}
root.addEventListener('click',e=>{
const b=e.target.closest('button');if(!b||!root.contains(b))return;
if(b.dataset.go){go(b.dataset.go);return;}if(b.dataset.component){s.selected=Number(b.dataset.component);grid();$('#br-selected').innerHTML=context();return;}if(b.dataset.defect){s.form.type=b.dataset.defect;s.error='';render();return;}if(b.dataset.removePhoto!==undefined){s.form.photos.splice(Number(b.dataset.removePhoto),1);render();return;}if(b.dataset.filter){s.filter=b.dataset.filter;render();return;}if(b.dataset.record){s.recordId=b.dataset.record;go('detail');return;}
switch(b.dataset.action){
case 'start':fresh();go('select');break;
case 'pending':s.filter='待复核';go('records');break;
case 'drafts':s.filter='草稿';go('records');break;
case 'to-form':go('form');break;
case 'photo':if(s.form.photos.length<6){s.form.photos.push('demo-photo-'+(s.form.photos.length+1));s.form.noPhoto=false;s.toast='已添加示例照片；正式版在此调用拍照或相册。';}else s.toast='原型最多展示 6 张示例照片。';render();break;
case 'save':save();break;
case 'to-review':s.error=validate();if(s.error){$('#br-error').textContent=s.error;$('#br-error').scrollIntoView?.({block:'nearest'});}else go('review');break;
case 'submit':if(!s.online){s.error='网络尚未恢复，内容未丢失。取消网络中断演示后可重试。';render();break;}s.error=validate();if(s.error){render();break;}const old=s.recordId,r={id:`M2026-${String(seq++).padStart(3,'0')}`,component:component(),form:structuredClone(s.form),description:desc(),draft:false};s.records.unshift(r);s.drafts=s.drafts.filter(x=>x.id!==old);s.recordId=r.id;go('success');break;
case 'same':fresh();go('form');break;
case 'next':s.selected=s.selected%8+1;fresh();go('select');break;
case 'view-record':go('detail');break;
case 'to-records':go('records');break;
case 'resume':{const d=s.drafts.find(x=>x.id===s.recordId);if(d){s.form=structuredClone(d.form);s.span=d.component.span;s.kind=d.component.kind;s.selected=d.component.index;go('form');}break;}
case 'back':go(({select:'home',form:'select',review:'form',success:'home',detail:'records'})[s.page]||'home');break;
}});
root.addEventListener('input',e=>{const t=e.target;if(t.id==='br-search'){s.query=t.value;grid();return;}if(t.dataset.field){s.form[t.dataset.field]=t.type==='checkbox'?t.checked:t.value;if($('#br-description'))$('#br-description').textContent=desc();}});
root.addEventListener('change',e=>{const t=e.target;if(t.dataset.select){s[t.dataset.select]=t.value;s.query='';s.selected=1;fresh();render();}if(t.id==='br-offline'){s.online=!t.checked;s.error='';render();}});
render();
if(globalThis.Tweak){const t=new Tweak({container:$('#br-shell'),onChange:()=>{root.style.setProperty('--touch',design.touch+'px');if(s.page==='select')grid();}});t.addSelect(design,'entry',{label:'构件选择布局',options:[{label:'编号网格',value:'grid'},{label:'双列列表',value:'list'}]});t.addSlider(design,'touch',{label:'现场操作按钮高度',min:44,max:56,step:2,unit:'px'});}
})();
</script>
</div>
