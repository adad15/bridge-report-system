<script>

{id:'beam-1-1',name:'1-1# 主梁',part:'上部结构',year:2025,history:[{id:'obs-2025-01',type:'横向裂缝',place:'底面，距小桩号端 2.0 m',text:'1 条横向裂缝，长 0.80 m，最大宽度 0.15 mm。',len:'0.80',width:'0.15',kind:'crack',photo:'2025-001'},{id:'obs-2025-02',type:'剥落、掉角',place:'侧面，距小桩号端 3.2 m',text:'局部混凝土剥落，面积 0.06 m²。',area:'0.06',kind:'area',photo:'2025-002'}]},
{id:'beam-1-2',name:'1-2# 主梁',part:'上部结构',year:2025,history:[]},
{id:'bearing-1-1',name:'1-1# 支座',part:'支座',year:2024,history:[{id:'obs-2024-03',type:'开裂',place:'支座本体侧面',text:'表面开裂，长 0.10 m，最大宽度 0.20 mm。',len:'0.10',width:'0.20',kind:'crack',photo:'2024-016'}]},
{id:'beam-1-3',name:'1-3# 主梁',part:'上部结构',year:2025,history:[]}
];
const init=()=>({version:2,seq:1,revision:0,savedAt:null,work:Object.fromEntries(components.map(c=>[c.id,{started:false,done:false,newChecked:false,reviews:{},added:[]}])),upload:{status:'idle',batch:'DEMO-2026-001'}});
const seededInit=()=>{const d=init();d.work['beam-1-2']={started:true,done:true,newChecked:true,reviews:{},added:[]};d.work['beam-1-1'].started=true;d.work['beam-1-1'].reviews['obs-2025-01']={condition:'无明显变化',repair:'未见维修',len:'0.80',width:'0.15',area:'',note:'现场复测，无明显变化。',photos:1,photoNote:'',reviewed:true,measurementSource:'本次填写'};return d;};

function valid(v){return v?.version===2&&components.every(c=>v.work?.[c.id]&&Array.isArray(v.work[c.id].added));}
try{const v=JSON.parse(localStorage.getItem(key)||'null');if(valid(v)){data=v;saveMode='local';}}catch(e){}
if(saveMode==='none'&&valid(hostSnapshot())){data=hostSnapshot();saveMode='host';}
const ui={page:'list',scope:'beam',scopeOpen:false,searchOpen:false,comp:components[0].id,edit:null,filter:'全部',query:'',error:'',toast:'',showPhotos:false,offline:false,uploading:false,confirmDelete:false};

function validateRecord(r,h){if(h&&(!r.condition||!r.repair))return '请分别选择病害变化和维修情况。';if(!h&&!r.place.trim())return '请填写新增病害的具体位置。';const kind=h?.kind||(r.type==='剥落、掉角'?'area':'crack'),need=!h||!['本次未见','无法判定'].includes(r.condition),pos=k=>Number.isFinite(Number(r[k]))&&Number(r[k])>0;if(need&&(kind==='crack'?(!pos('len')||!pos('width')):!pos('area')))return '请填写有效的本次测量值，或经现场核实后沿用上次值。';if(h&&(r.repair==='已维修'||['本次未见','无法判定'].includes(r.condition))&&!r.note.trim())return '请补充维修情况、现场观察或无法判定的原因。';if(!r.photos&&!r.photoNote.trim())return '请添加本次照片，或说明暂缺照片原因。';return '';}
function openComponent(id){ui.comp=id;ui.scope=scopeFor(current());go('component');}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled||!root.contains(b)||ui.uploading)return;if(b.dataset.scope){ui.scope=b.dataset.scope;ui.scopeOpen=false;ui.query='';ui.searchOpen=false;ui.filter='全部';render();return;}if(b.dataset.listFilter){ui.filter=b.dataset.listFilter;render();return;}if(b.dataset.go){go(b.dataset.go);return;}if(b.dataset.component){openComponent(b.dataset.component);return;}if(b.dataset.filter){ui.filter=b.dataset.filter;render();return;}if(b.dataset.history){ui.edit=b.dataset.history;if(!work().reviews[ui.edit]&&!syncLocked()){work().reviews[ui.edit]=recordTemplate();dirty();persist();}go('edit');return;}if(b.dataset.new){ui.edit='new:'+b.dataset.new;go('edit');return;}if(b.dataset.choice&&!syncLocked()){const r=rec();r[b.dataset.choice]=b.dataset.value;r.reviewed=false;dirty();persist();ui.error='';render();return;}
switch(b.dataset.action){
case 'enter-list':go('list');break;
case 'toggle-scope':ui.scopeOpen=!ui.scopeOpen;render();break;
case 'toggle-search':ui.searchOpen=!ui.searchOpen;if(!ui.searchOpen)ui.query='';render();if(ui.searchOpen)$('#br-search')?.focus();break;
case 'continue-list':{const target=upcoming(scopeItems());if(target)openComponent(target.id);break;}
case 'next-group':{const target=upcoming(components);if(target){ui.scope=scopeFor(target);ui.filter='待检查';ui.query='';go('list');}break;}
case 'to-upload':go('upload');break;
case 'back':go(ui.page==='edit'?'component':ui.page==='receipt'?'upload':ui.page==='list'?'bridge':'list');break;
case 'history-photo':ui.showPhotos=!ui.showPhotos;render();break;
case 'add-new':if(syncLocked())break;const nr={...recordTemplate(),id:'local-new-'+data.seq++,type:current().part==='支座'?'开裂':'横向裂缝',place:''};work().added.push(nr);work().newChecked=false;dirty();persist();ui.edit='new:'+nr.id;go('edit');break;
case 'copy-values':{if(syncLocked())break;const h=history(),r=rec();r.len=h.len||'';r.width=h.width||'';r.area=h.area||'';r.measurementSource='现场核实沿用';r.reviewed=false;dirty();persist();render();break;}
case 'photo':if(syncLocked())break;rec().photos++;rec().reviewed=false;dirty();persist();render();break;
case 'delete-new':if(syncLocked())break;if(!ui.confirmDelete){ui.confirmDelete=true;render();}else{work().added=work().added.filter(r=>r.id!==ui.edit.slice(4));work().newChecked=false;dirty();persist();go('component');}break;
case 'save-record':{if(syncLocked())break;const r=rec();ui.error=validateRecord(r,history());if(ui.error){render();break;}r.reviewed=true;dirty();persist();go('component');break;}
case 'complete':{if(syncLocked())break;const w=work(),c=current();if(!w.done){if(c.history.some(h=>!reviewed(w.reviews[h.id])))ui.error='还有旧病害未复查，请逐条填写本次情况。';else if(w.added.some(r=>!r.reviewed))ui.error='还有新增病害草稿，请补齐并确认。';else if(!w.newChecked)ui.error='请确认是否已检查并记录全部新增病害。';else{w.done=true;w.started=true;data.revision++;const stored=persist();if(!stored){w.done=false;ui.error='本地保存未成功，请保留页面并重试。';render();break;}ui.error='';}}if(ui.error){render();break;}const next=upcoming(scopeItems());if(next)openComponent(next.id);else{ui.query='';ui.filter='待检查';go('list');}break;}
case 'upload':{if(syncLocked()||issues().length)break;ui.uploading=true;ui.error='';render();setTimeout(()=>{ui.uploading=false;if(ui.offline){data.upload.status='failed';persist();render();}else{data.upload.status='done';data.upload.receiptRevision=data.revision;persist();go('receipt');}},450);break;}
case 'receipt':go('receipt');break;
}});
root.addEventListener('input',e=>{const t=e.target;if(t.id==='br-search'){ui.query=t.value;list();return;}if(t.dataset.field&&!syncLocked()){const r=rec();r[t.dataset.field]=t.value;r.reviewed=false;dirty();persist();}});
root.addEventListener('change',e=>{const t=e.target;if(t.id==='br-new-checked'&&!syncLocked()){work().newChecked=t.checked;dirty();persist();render();}if(t.id==='br-offline'){ui.offline=t.checked;}if(t.dataset.field==='type'){render();}});
window.addEventListener('openai:set_globals',e=>{const v=e.detail?.globals?.widgetState?.privateContent?.reinspection;if(saveMode!=='local'&&valid(v)&&v.revision>data.revision){data=v;saveMode='host';render();}});
render();if(globalThis.Tweak){const t=new Tweak({container:$('#br-shell'),onChange:()=>{root.style.setProperty('--touch',design.touch+'px');render();}});t.addToggle(design,'history',{label:'构件页直接展开上次描述'});t.addSlider(design,'touch',{label:'现场按钮高度',min:44,max:56,step:2,unit:'px'});}
})();
</script>
</div></body></html>
